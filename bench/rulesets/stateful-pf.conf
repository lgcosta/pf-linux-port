# PF-on-Linux: stateful transit rules (keep state) on the bench path.
# Management rules first, see stateless-pf.conf.
set skip on lo
block all
pass quick on eth0
pass out quick on eth2 inet from 10.0.0.0/24 to 10.0.1.0/24 keep state
pass in quick on eth1 inet from 10.0.0.0/24 to 10.0.1.0/24 keep state
