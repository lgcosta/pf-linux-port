# PF-on-Linux: stateless transit rules on the bench path (eth1 in, eth2 out).
# The management rules must come BEFORE any block, because the port's
# stateless default for an unmatched packet is drop (the same last-match
# semantics as Linux), unlike OpenBSD's pass.
set skip on lo
block all
pass quick on eth0
pass out quick on eth2 inet from 10.0.0.0/24 to 10.0.1.0/24
pass in quick on eth1 inet from 10.0.0.0/24 to 10.0.1.0/24
