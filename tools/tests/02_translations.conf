# PFLINUX offline parse test 2 — translations, redirections, diversion.

xif = "lo"
table <ext> const { 127.0.0.1 }

set reassemble yes no-df
set syncookies adaptive (start 25%, end 12%)

pass in quick on $xif inet proto tcp from any to any port 8080 \
	rdr-to 127.0.0.1 port 80 sticky-address
pass out quick on $xif inet proto tcp from 127.0.0.0/8 to any \
	nat-to <ext> static-port
pass in quick on $xif inet6 proto tcp from any to any port 8080 \
	rdr-to ::1
pass in quick on $xif inet proto tcp from any to any port 1723 \
	route-to 127.0.0.1
pass in quick on $xif proto tcp from any to any port 21 \
	divert-to 127.0.0.1 port 7000
pass in quick on $xif proto tcp from any to any port 110 divert-packet port 2000
pass quick on $xif inet proto tcp from 127.0.0.5 to any binat-to 127.0.0.9
pass in quick on $xif inet proto tcp all af-to inet6 from ::1
match out quick on $xif inet proto tcp all set (delay 100)
block drop in quick on $xif inet from urpf-failed to any
